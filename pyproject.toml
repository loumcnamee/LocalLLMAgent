[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localllm"
version = "0.1.0"
description = "Local LLM examples and agent loop utilities using Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"ollama>=0.4.0",
	"openai>=1.40.0",
	"huggingface-hub>=0.24.0",
	"transformers>=4.44.0",
	"tokenizers>=0.19.0",
	"chromadb>=0.5.0",
	"langchain>=0.3.0",
	"langchain-ollama>=0.2.0",
	"langchain-community>=0.3.0",
	"langchain-chroma>=0.1.0",
	"sentence-transformers>=3.0.0",
	"python-dotenv>=1.0.0",
	"rich>=13.7.0",
	"httpx>=0.27.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agentloop*"]
namespaces = true
